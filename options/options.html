<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PandaVoice AI Settings</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #121212; color: #ffffff; }
        h1 { font-size: 1.5rem; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="password"] { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; background-color: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #d70f64; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background-color: #e21c72; }
        #status { margin-top: 15px; color: #4caf50; font-weight: bold; }
        #error { margin-top: 15px; color: #f44336; font-weight: bold; }
    </style>
</head>
<body>
    <h1>PandaVoice AI Settings</h1>
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Enter your Gemini 2.5 Flash API Key">
    <button id="saveBtn">Save API Key</button>
    <div id="status" aria-live="polite"></div>
    <div id="error" aria-live="assertive"></div>
    <script src="options.js"></script>
</body>
</html>
